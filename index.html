<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>💌 Uma Carta</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    transition:all .8s ease;
    font-family:Georgia, serif;
}

.carta{

    width:min(95vw,850px);

    min-height:700px;

    background:#fffaf5;

    border-radius:35px;

    padding:40px;

    display:flex;

    flex-direction:column;

    align-items:center;

    text-align:center;

    box-shadow:
    0 20px 60px rgba(0,0,0,.15);

}

.areaGif{

    padding:25px;

    border-radius:25px;

    margin-bottom:25px;

    transition:.8s;

}

.gatinho{

    width:min(260px,65vw);

    display:block;

}

.titulo{

    font-size:clamp(2rem,5vw,4rem);

    margin-bottom:25px;

    color:#c05686;

}

.texto{

    font-size:clamp(1.1rem,2vw,1.4rem);

    line-height:1.8;

    color:#444;

    max-width:650px;

}

.botao{

    margin-top:auto;

    border:none;

    background:#d85a9a;

    color:white;

    padding:15px 40px;

    border-radius:999px;

    cursor:pointer;

    font-size:1.1rem;

    transition:.3s;

}

.botao:hover{

    transform:scale(1.05);

}

@media(max-width:700px){

.carta{

    padding:25px;

    min-height:90vh;

}

.gatinho{

    width:55vw;

}

}

</style>
</head>
<body>

<div class="carta">

<div id="areaGif" class="areaGif">

<img
id="gatinho"
class="gatinho"
src="gifs/gatinho branco.gif">

</div>

<h1 id="titulo" class="titulo">
💌 Uma Carta
</h1>

<div id="texto" class="texto">

Esta página contém música.

<br><br>

Clique em continuar para começar.

</div>

<button id="btn" class="botao">
Continuar
</button>

</div>

<audio id="musica" loop>
<source src="musica.mp3" type="audio/mpeg">
</audio>

<script>

const paginas = [

{
gif:"gifs/gatinho branco.gif",
gifBg:"#d9e8ff",
cor1:"#d9e8ff",
cor2:"#ffffff",
titulo:"💌 Uma Carta",
texto:"Esta página contém música.<br><br>Clique em continuar para começar."
},

{
gif:"gifs/gatinho feliz.gif",
gifBg:"#4a4a4a",
cor1:"#4a4a4a",
cor2:"#7a7a7a",
titulo:"Página 1",
texto:"Texto da primeira página."
},

{
gif:"gifs/gatinholaranjasem.gif",
gifBg:"#d8a36c",
cor1:"#d8a36c",
cor2:"#f2d5af",
titulo:"Página 2",
texto:"Texto da segunda página."
},

{
gif:"gifs/gatinhoacinzentado.gif",
gifBg:"#6f7f99",
cor1:"#6f7f99",
cor2:"#c4cedf",
titulo:"Página 3",
texto:"Texto da terceira página."
},

{
gif:"gifs/gatinhorolando.gif",
gifBg:"#ffffff",
cor1:"#ffe8f4",
cor2:"#ffffff",
titulo:"Página 4",
texto:"Texto da quarta página."
},

{
gif:"gifs/gatinhobfeliz.gif",
gifBg:"#ffffff",
cor1:"#fff6fb",
cor2:"#ffffff",
titulo:"Página 5",
texto:"Texto da quinta página."
},

{
gif:"gifs/gatinho apaixonado.gif",
gifBg:"#2d2323",
cor1:"#3d1d1d",
cor2:"#a43b3b",
titulo:"Página 6",
texto:"Texto da sexta página."
},

{
gif:"gifs/gatinho estrelado.gif",
gifBg:"#08366b",
cor1:"#04152e",
cor2:"#0b478f",
titulo:"❤️ Final",
texto:"Aqui ficará a última parte da carta."
}

];

let atual = 0;

function carregarPagina(indice){

const pagina = paginas[indice];

document.body.style.background =
`linear-gradient(
180deg,
${pagina.cor1},
${pagina.cor2}
)`;

document.getElementById("gatinho").src =
pagina.gif;

document.getElementById("areaGif").style.background =
pagina.gifBg;

document.getElementById("titulo").innerHTML =
pagina.titulo;

document.getElementById("texto").innerHTML =
pagina.texto;

if(indice >= 6){

document.getElementById("titulo").style.color =
"white";

document.getElementById("texto").style.color =
"white";

document.querySelector(".carta").style.background =
"rgba(255,255,255,.08)";

}else{

document.getElementById("titulo").style.color =
"#c05686";

document.getElementById("texto").style.color =
"#444";

document.querySelector(".carta").style.background =
"#fffaf5";

}

}

carregarPagina(0);

document.getElementById("btn")
.addEventListener("click",()=>{

if(atual===0){

document.getElementById("musica")
.play()
.catch(()=>{});

}

if(atual < paginas.length-1){

atual++;

carregarPagina(atual);

}else{

document.getElementById("btn").innerHTML =
"❤️ Fim";

}

});

</script>

</body>
</html>
