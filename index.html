<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Uma Carta</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Georgia, serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    transition:0.8s;
    padding:20px;
}

.card{
    width:min(90vw,700px);
    background:white;
    border-radius:25px;
    padding:30px;
    box-shadow:0 10px 40px rgba(0,0,0,.15);
    text-align:center;
}

.gatinho{
    width:min(220px,70vw);
    margin-bottom:20px;
}

h1{
    margin-bottom:20px;
    color:#b84d7d;
}

.texto{
    font-size:1.2rem;
    line-height:1.8;
    min-height:150px;
    color:#444;
}

button{
    margin-top:25px;
    border:none;
    background:#d85a9a;
    color:white;
    padding:12px 28px;
    border-radius:30px;
    cursor:pointer;
    font-size:1rem;
}

button:hover{
    opacity:.9;
}

@media(max-width:600px){

.card{
    padding:20px;
}

.texto{
    font-size:1rem;
}
}
</style>
</head>
<body>

<div class="card">

<img id="gatinho"
class="gatinho"
src="gifs/gatinho branco.gif">

<h1 id="titulo">💌 Uma Carta</h1>

<div id="texto" class="texto">
Esta página contém música.<br><br>
Clique em continuar para começar.
</div>

<button id="btn">
Continuar
</button>

</div>

<audio id="musica" loop>
    <source src="musica.mp3" type="audio/mpeg">
</audio>

<script>

const paginas = [

{
gif:"gifs/gatinho branco.gif",
cor:"#fff8fb",
titulo:"💌 Uma Carta",
texto:"Esta página contém música.<br><br>Clique em continuar para começar."
},

{
gif:"gifs/gatinho feliz.gif",
cor:"#ffd6e7",
titulo:"Página 1",
texto:"Texto de teste da página 1."
},

{
gif:"gifs/gatinholaranjasem.gif",
cor:"#f5d3b3",
titulo:"Página 2",
texto:"Texto de teste da página 2."
},

{
gif:"gifs/gatinhoocinzentado.gif",
cor:"#d8dde5",
titulo:"Página 3",
texto:"Texto de teste da página 3."
},

{
gif:"gifs/gatinhorolando.gif",
cor:"#f4d7e6",
titulo:"Página 4",
texto:"Texto de teste da página 4."
},

{
gif:"gifs/gatinho apaixonado.gif",
cor:"#ffbcbc",
titulo:"Página 5",
texto:"Texto de teste da página 5."
},

{
gif:"gifs/gatinho estrelado.gif",
cor:"#11264d",
titulo:"❤️ Final",
texto:"Aqui ficará a última parte da carta."
}

];

let atual = 0;

document.body.style.background =
paginas[0].cor;

document
.getElementById("btn")
.addEventListener("click",()=>{

if(atual===0){
document
.getElementById("musica")
.play()
.catch(()=>{});
}

if(atual < paginas.length-1){

atual++;

document.body.style.background =
paginas[atual].cor;

document.getElementById("gatinho").src =
paginas[atual].gif;

document.getElementById("titulo").innerHTML =
paginas[atual].titulo;

document.getElementById("texto").innerHTML =
paginas[atual].texto;

if(atual===paginas.length-1){

document.getElementById("titulo").style.color =
"white";

document.getElementById("texto").style.color =
"white";

}else{

document.getElementById("titulo").style.color =
"#b84d7d";

document.getElementById("texto").style.color =
"#444";

}
}
});
</script>

</body>
</html>
